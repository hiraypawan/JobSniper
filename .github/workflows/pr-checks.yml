name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:filters
      - run: npm run test:remote-jobs
      - run: npx tsx scripts/test-http-cache.ts
      - run: npx tsx scripts/test-himalayas.ts
      - name: Build Cloudflare static export
        run: npm run build:cf
        env:
          STATIC_EXPORT: 1
