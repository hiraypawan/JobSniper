name = "startupsniper"
main = "workers/index.ts"
account_id = "a4e4e2bec6f7d6bf6a4dc03d732bbdc9"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serves static Next.js build (`out/`) AND `/api/*` Live Worker endpoints from a single deploy.
# Note: You can also deploy straight to Cloudflare Pages (`functions/api/[[route]].ts` handles `/api/*` automatically with ZERO Cron required).
[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true

# Optional daily source refresh (30 0 * * * UTC = 6:00 AM IST).
# Manual syncs are cooldown-limited; D1 and upstream free-tier quotas still apply.
[triggers]
crons = ["30 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "startupsniper-db"
database_id = "e908fd30-d905-4c3b-83fa-d8dca5cf234b"
migrations_dir = "migrations"

# Optional KV namespace (primary response cache lives in D1 `http_cache` for 100,000 free writes/day)
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000" # Optional: replace or omit if using D1 cache only

# --- Optional shared AI keys (server-side /api/ai proxy, AC7) ---------------
# When set, the app generates AI pitches via /api/ai without requiring users to
# bring their own key, and the key never reaches the browser.
# Recommended (secrets, not plaintext):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
# (On Cloudflare Pages: Pages dashboard → Settings → Environment variables / Secrets)
# [vars]
#   OPENROUTER_API_KEY = ""
#   GEMINI_API_KEY = ""
# ---------------------------------------------------------------------------
